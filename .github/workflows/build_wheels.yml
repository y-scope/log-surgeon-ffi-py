name: "build-wheels"

on:
  pull_request:
    paths:
      - ".github/workflows/build_wheels.yml"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "README.md"
      - "src/**"
      - "taskfiles/**"
      - "taskfile.yml"
  push:
    paths:
      - ".github/workflows/build_wheels.yml"
      - ".gitmodules"
      - "CMakeLists.txt"
      - "pyproject.toml"
      - "README.md"
      - "src/**"
      - "taskfiles/**"
      - "taskfile.yml"
  schedule:
    # Run every Tuesday at 00:15 UTC (the 15 is to avoid periods of high load)
    - cron: "15 0 * * 2"

concurrency:
  group: "${{github.workflow}}-${{github.ref}}"
  # Cancel in-progress jobs for efficiency
  cancel-in-progress: true

jobs:
  build_wheels:
    name: "Build ${{ matrix.build.name }}"
    runs-on: "${{ matrix.build.os }}"
    strategy:
      matrix:
        build:
          # Linux x86_64 builds
          - name: "cp39-manylinux_x86_64"
            os: "ubuntu-22.04"
          - name: "cp310-manylinux_x86_64"
            os: "ubuntu-22.04"
          - name: "cp311-manylinux_x86_64"
            os: "ubuntu-22.04"
          - name: "cp312-manylinux_x86_64"
            os: "ubuntu-22.04"
          - name: "cp313-manylinux_x86_64"
            os: "ubuntu-22.04"
          - name: "cp39-musllinux_x86_64"
            os: "ubuntu-22.04"
          - name: "cp310-musllinux_x86_64"
            os: "ubuntu-22.04"
          - name: "cp311-musllinux_x86_64"
            os: "ubuntu-22.04"
          - name: "cp312-musllinux_x86_64"
            os: "ubuntu-22.04"
          - name: "cp313-musllinux_x86_64"
            os: "ubuntu-22.04"

          # Linux i686 builds (32-bit, uses QEMU)
          - name: "cp39-manylinux_i686"
            os: "ubuntu-22.04"
          - name: "cp310-manylinux_i686"
            os: "ubuntu-22.04"
          - name: "cp311-manylinux_i686"
            os: "ubuntu-22.04"
          - name: "cp312-manylinux_i686"
            os: "ubuntu-22.04"
          - name: "cp313-manylinux_i686"
            os: "ubuntu-22.04"
          - name: "cp39-musllinux_i686"
            os: "ubuntu-22.04"
          - name: "cp310-musllinux_i686"
            os: "ubuntu-22.04"
          - name: "cp311-musllinux_i686"
            os: "ubuntu-22.04"
          - name: "cp312-musllinux_i686"
            os: "ubuntu-22.04"
          - name: "cp313-musllinux_i686"
            os: "ubuntu-22.04"

          # Linux aarch64 builds (native ARM64 runners - no QEMU needed)
          - name: "cp39-manylinux_aarch64"
            os: "ubuntu-22.04-arm"
          - name: "cp310-manylinux_aarch64"
            os: "ubuntu-22.04-arm"
          - name: "cp311-manylinux_aarch64"
            os: "ubuntu-22.04-arm"
          - name: "cp312-manylinux_aarch64"
            os: "ubuntu-22.04-arm"
          - name: "cp313-manylinux_aarch64"
            os: "ubuntu-22.04-arm"
          - name: "cp39-musllinux_aarch64"
            os: "ubuntu-22.04-arm"
          - name: "cp310-musllinux_aarch64"
            os: "ubuntu-22.04-arm"
          - name: "cp311-musllinux_aarch64"
            os: "ubuntu-22.04-arm"
          - name: "cp312-musllinux_aarch64"
            os: "ubuntu-22.04-arm"
          - name: "cp313-musllinux_aarch64"
            os: "ubuntu-22.04-arm"

          # macOS universal2 builds (fat binaries for both x86_64 and arm64)
          - name: "cp39-macosx_universal2"
            os: "macos-14"
          - name: "cp310-macosx_universal2"
            os: "macos-14"
          - name: "cp311-macosx_universal2"
            os: "macos-14"
          - name: "cp312-macosx_universal2"
            os: "macos-14"
          - name: "cp313-macosx_universal2"
            os: "macos-14"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v4"
        with:
          submodules: "recursive"

      - name: "Set up QEMU"
        if: "contains(matrix.build.name, 'i686')"
        uses: "docker/setup-qemu-action@v3"
        with:
          platforms: "linux/386"

      - name: "Build wheels"
        uses: "pypa/cibuildwheel@v2.21"
        env:
          CIBW_BUILD: "${{ matrix.build.name }}"

      - uses: "actions/upload-artifact@v4"
        with:
          name: "wheel-${{ matrix.build.name }}"
          path: "./wheelhouse/*.whl"
          retention-days: 1

  combine-wheels:
    needs: ["build_wheels"]
    name: "Combine wheels"
    runs-on: "ubuntu-latest"
    env:
      WHEEL_DIR: "/tmp/wheels"

    steps:
      - uses: "actions/download-artifact@v4"
        with:
          path: "${{env.WHEEL_DIR}}"
          merge-multiple: true

      - uses: "actions/upload-artifact@v4"
        with:
          name: "all-wheels"
          path: "${{env.WHEEL_DIR}}"
