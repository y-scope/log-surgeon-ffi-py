version: "3"

includes:
  utils:
    internal: true
    taskfile: "../tools/yscope-dev-utils/exports/taskfiles/utils/utils.yaml"

vars:
  G_DEPS_DIR: "{{.G_BUILD_DIR}}/deps"

  # This path must be kept in-sync with its usage in CMakeLists.txt and examples/CMakeLists.txt.
  G_DEPS_CMAKE_SETTINGS_DIR: "{{.G_DEPS_DIR}}/cmake-settings"

  # These names must match their CMake package names.
  G_FMT_CMAKE_NAME: "fmt"
  G_GSL_CMAKE_NAME: "Microsoft.GSL"

  G_LOG_MECHANIC_SRC_DIR: "{{.G_DEPS_DIR}}/log-mechanic-src"
  G_LOG_MECHANIC_INSTALL_DIR: "{{.G_DEPS_DIR}}/log-mechanic-install"

tasks:
  install-all:
    run: "once"
    cmds:
      - task: "utils:cmake:install-deps-and-generate-settings"
        vars:
          CMAKE_SETTINGS_DIR: "{{.G_DEPS_CMAKE_SETTINGS_DIR}}"
          DEP_TASK: "install-all-parallel"

  install-all-parallel:
    internal: true
    run: "once"
    deps:
      - "log-surgeon"
      - "log-mechanic-build"

  log-surgeon:
    internal: true
    run: "once"
    deps:
      - "fmt"
      - "microsoft.gsl"
    cmds:
      - task: "utils:cmake:install-remote-tar"
        vars:
          CMAKE_GEN_ARGS:
            - "-C {{.G_DEPS_CMAKE_SETTINGS_DIR}}/{{.G_FMT_CMAKE_NAME}}.cmake"
            - "-C {{.G_DEPS_CMAKE_SETTINGS_DIR}}/{{.G_GSL_CMAKE_NAME}}.cmake"
            - "-DCMAKE_BUILD_TYPE=Release"
            - "-DCMAKE_INSTALL_MESSAGE=LAZY"
            - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
            - "-Dlog_surgeon_BUILD_TESTING=OFF"
          CMAKE_PACKAGE_NAME: "log_surgeon"
          CMAKE_SETTINGS_DIR: "{{.G_DEPS_CMAKE_SETTINGS_DIR}}"
          TAR_SHA256: "03d13d79114d5ab2af783e952197991ddaa51239a7ec89cf441e119f2aeb042e"
          TAR_URL: "https://github.com/y-scope/log-surgeon/archive/7afa3f2.tar.gz"
          WORK_DIR: "{{.G_DEPS_DIR}}"

  fmt:
    internal: true
    run: "once"
    cmds:
      - task: "utils:cmake:install-remote-tar"
        vars:
          CMAKE_GEN_ARGS:
            - "-DCMAKE_BUILD_TYPE=Release"
            - "-DCMAKE_INSTALL_MESSAGE=LAZY"
            - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
            - "-DFMT_DOC=OFF"
            - "-DFMT_TEST=OFF"
          CMAKE_PACKAGE_NAME: "{{.G_FMT_CMAKE_NAME}}"
          CMAKE_SETTINGS_DIR: "{{.G_DEPS_CMAKE_SETTINGS_DIR}}"
          TAR_SHA256: "bc23066d87ab3168f27cef3e97d545fa63314f5c79df5ea444d41d56f962c6af"
          TAR_URL: "https://github.com/fmtlib/fmt/archive/refs/tags/11.2.0.tar.gz"
          WORK_DIR: "{{.G_DEPS_DIR}}"

  microsoft.gsl:
    internal: true
    run: "once"
    cmds:
      - task: "utils:cmake:install-remote-tar"
        vars:
          CMAKE_GEN_ARGS:
            - "-DCMAKE_BUILD_TYPE=Release"
            - "-DCMAKE_INSTALL_MESSAGE=LAZY"
            - "-DCMAKE_POSITION_INDEPENDENT_CODE=ON"
            - "-DGSL_TEST=OFF"
          CMAKE_PACKAGE_NAME: "{{.G_GSL_CMAKE_NAME}}"
          CMAKE_SETTINGS_DIR: "{{.G_DEPS_CMAKE_SETTINGS_DIR}}"
          TAR_SHA256: "f0e32cb10654fea91ad56bde89170d78cfbf4363ee0b01d8f097de2ba49f6ce9"
          TAR_URL: "https://github.com/microsoft/GSL/archive/refs/tags/v4.0.0.tar.gz"
          WORK_DIR: "{{.G_DEPS_DIR}}"

  log-mechanic:
    internal: true
    run: "once"
    cmds:
      - task: "utils:remote:download-and-extract-tar"
        vars:
          FILE_SHA256: "c5772d0bf7176e4c5792bb3b65c3e790bffe82d249bc359a1f55f34818500681"
          OUTPUT_DIR: "{{.G_LOG_MECHANIC_SRC_DIR}}"
          URL: "https://github.com/jackluo923/log-surgeon/archive/ac9061a.tar.gz"

  log-mechanic-build:
    internal: true
    run: "once"
    deps:
      - "log-mechanic"
    vars:
      RUST_SRC_DIR: "{{.G_LOG_MECHANIC_SRC_DIR}}/rust"
    cmds:
      # Install rustup non-interactively if missing
      - |-
        if ! command -v rustup &> /dev/null; then
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --default-toolchain none
          . "$HOME/.cargo/env"
        fi
      # rustup show auto-installs the nightly toolchain from rust-toolchain.toml
      - |-
        . "$HOME/.cargo/env" 2>/dev/null || true
        cd "{{.RUST_SRC_DIR}}"
        rustup show
      # Platform-aware cargo build
      - |-
        . "$HOME/.cargo/env" 2>/dev/null || true
        cd "{{.RUST_SRC_DIR}}"
        mkdir -p "{{.G_LOG_MECHANIC_INSTALL_DIR}}"

        if [ "$(uname)" = "Darwin" ]; then
          # macOS: build for both architectures and create universal2 binary
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create \
            target/aarch64-apple-darwin/release/liblog_mechanic.dylib \
            target/x86_64-apple-darwin/release/liblog_mechanic.dylib \
            -output "{{.G_LOG_MECHANIC_INSTALL_DIR}}/liblog_mechanic.dylib"
        else
          # Linux: detect musl vs glibc
          if ldd --version 2>&1 | grep -qi musl; then
            ARCH="$(uname -m)"
            case "$ARCH" in
              x86_64)  RUST_TARGET="x86_64-unknown-linux-musl" ;;
              aarch64) RUST_TARGET="aarch64-unknown-linux-musl" ;;
              *)       echo "Unsupported musl architecture: $ARCH"; exit 1 ;;
            esac
            rustup target add "$RUST_TARGET"
            cargo build --release --target "$RUST_TARGET"
            cp "target/$RUST_TARGET/release/liblog_mechanic.so" \
              "{{.G_LOG_MECHANIC_INSTALL_DIR}}/liblog_mechanic.so"
          else
            cargo build --release
            cp target/release/liblog_mechanic.so \
              "{{.G_LOG_MECHANIC_INSTALL_DIR}}/liblog_mechanic.so"
          fi
        fi
